name: CI Test Suite

# When to run this workflow
on:
  push:
    branches: [main] # Run on pushes to main
  pull_request:
    branches: [main] # Run on PRs targeting main

# Cancel in-progress runs if a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    # Test matrix - runs tests on multiple Python versions and operating systems
    strategy:
      fail-fast: false  # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        # Optionally exclude specific combinations
        # exclude:
        #   - os: macos-latest
        #     python-version: "3.9"

    steps:
      # Step 1: Checkout your code
      # This downloads your repository code to the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install uv (fast Python package installer)
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true  # Cache packages for faster runs
          cache-dependency-glob: "pyproject.toml"

      # Step 3: Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Step 4: Install your package and dependencies
      - name: Install package
        run: |
          uv pip install --system -e ".[dev,test]"
        # --system: Install to system Python (not a venv)
        # -e: Editable install (like pip install -e .)
        # .[dev,test]: Install with dev and test extras

      # Step 5: Run tests with unittest
      - name: Run tests
        run: |
          python -m unittest discover -s tests -p "*tests.py" -v
        # -s tests: Start directory for discovery
        # -p "test_*.py": Pattern to match test files
        # -v: Verbose output

      # Step 6: Run tests with coverage (optional but recommended)
      - name: Run tests with coverage
        run: |
          uv pip install --system coverage
          coverage run -m unittest discover -s tests -p "*tests.py"
          coverage report -m
          coverage xml
        # Creates coverage.xml for code coverage reporting

      # Step 7: Upload coverage to Codecov (optional)
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        # Only upload from one matrix combination to avoid duplicates

      # Step 8: Upload test results to Codecov (optional)
      - name: Upload test results to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' && ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          file: ./junit.xml
          flags: unittests
          name: codecov-tests
          fail_ci_if_error: false


  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          uv pip install --system ruff

      # Check for code style issues
      - name: Lint with ruff
        run: |
          ruff check src/ tests/
        continue-on-error: true  # Don't fail the build, just warn

      # Check code formatting
      - name: Check formatting
        run: |
          ruff format --check src/ tests/
        continue-on-error: true
